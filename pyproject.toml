[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "software-factory"
version = "0.1.0"
description = "Software factory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.35.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "e2b>=2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
]

[project.scripts]
software-factory = "software_factory.__main__:main"
software-factory-worker = "software_factory.orchestration.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"software_factory.orchestration" = ["skills/*/*"]
